<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Note</title>
    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="manifest" href="./images/site.webmanifest" />
    <!-- /Favicon -->

    <link rel="stylesheet" href="./css/0-variables.css" />
    <link rel="stylesheet" href="./css/1-global.css" />
    <link rel="stylesheet" href="./css/2-header.css" />
    <link rel="stylesheet" href="./css/3-body.css" />
    <link rel="stylesheet" href="./css/4-add-new-note-form.css">
    <link rel="stylesheet" href="./css/5-note-card.css" />

    <script src="app.js" defer></script>
  </head>

  <body>
    <!-- Header -->
    <header id="header">
      <h1 id="header-title">Secure Note</h1>
      <button id="add-note-button">Add New Note</button>
    </header>
    <!-- /Header -->

    <!-- Body -->
    <section id="body">
      <h2 id="body-header-title">Notes</h2>
      <div id="notes-container"></div>
    </section>
    <!-- /Body -->

    <!-- AddNewNoteForm -->
    <div id="add-new-note-form-layer" class="hidden">
      <div id="add-new-note-form">
        <h2 id="add-new-note-title">Add New Note</h2>
        <form id="add-new-note-form-element">
          <div class="input-group">
            <label for="note-title-input">Title</label>
            <input
              type="text"
              id="note-title-input"
              name="note-title"
              required
            />
          </div>
          <div class="input-group">
            <label for="note-content-input">Content</label>
            <input
              type="text"
              id="note-content-input"
              name="note-content"
              required
            />
          </div>
          <div class="input-group">
            <label for="note-secret-input">Secret</label>
            <input
              type="text"
              id="note-secret-input"
              name="note-secret"
              required
            />
          </div>
          <button id="add-note-submit-button" type="submit">Add Note</button>
        </form>
      </div>
    </div>
    <!-- /AddNewNoteForm -->
  </body>
</html>
