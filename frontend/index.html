<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>66010449 Secure Note</title>
    <!-- #region Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="manifest" href="./images/site.webmanifest" />
    <!-- #endregion /Favicon -->

    <!-- #region Stylesheets -->
    <link rel="stylesheet" href="./css/0-variables.css" />
    <link rel="stylesheet" href="./css/1-global.css" />
    <link rel="stylesheet" href="./css/2-header.css" />
    <link rel="stylesheet" href="./css/3-body.css" />
    <link rel="stylesheet" href="./css/4-note-form.css" />
    <link rel="stylesheet" href="./css/5-note-card.css" />
    <link rel="stylesheet" href="./css/6-note-card-skeleton.css" />
    <link rel="stylesheet" href="./css/7-loading-icon.css" />
    <!-- #endregion /Stylesheets -->

    <script src="./config.js"></script>
    <script src="./scripts/app.js" type="module" defer></script>
  </head>

  <body>
    <!-- #region Header -->
    <header id="header">
      <h1 id="header-title">66010449 Secure Note</h1>
      <button id="add-note-button">Add New Note</button>
    </header>
    <!-- #endregion /Header -->

    <!-- #region Body -->
    <section id="body">
      <div id="body-header-row">
        <h2 id="body-header-title">Notes</h2>
        <input
          type="search"
          id="notes-search-input"
          name="notes-search"
          placeholder="Search notes"
          aria-label="Search notes"
        />
      </div>
      <div id="startup-loading">
        <span id="startup-loading-spinner"></span>
        <p id="startup-loading-text">Loading notes...</p>
      </div>
      <div id="notes-container"></div>
    </section>
    <!-- #endregion /Body -->

    <!-- #region AddNewNoteForm -->
    <div id="note-form-layer" class="hidden">
      <div id="note-form">
        <button id="close-note-form-button">
          <svg viewBox="0 0 24 24" id="close-note-form-icon">
            <path
              fill="currentColor"
              d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z"
            />
          </svg>
        </button>
        <h2 id="note-title">Add New Note</h2>
        <p id="note-form-error" role="alert" aria-live="polite"></p>
        <form id="note-form-element">
          <div class="input-group">
            <label for="note-id-input">ID</label>
            <input
              type="text"
              id="note-id-input"
              name="note-id"
              disabled
            />
          </div>
          <div class="input-group">
            <label for="note-title-input">Title</label>
            <input
              type="text"
              id="note-title-input"
              name="note-title"
              required
            />
          </div>
          <div class="input-group">
            <label for="note-content-input">Content</label>
            <input
              type="text"
              id="note-content-input"
              name="note-content"
              required
            />
          </div>
          <div class="input-group">
            <label for="note-secret-input">Secret</label>
            <input
              type="text"
              id="note-secret-input"
              name="note-secret"
              required
            />
          </div>
          <button id="add-note-submit-button" type="submit">Add Note</button>
        </form>
      </div>
    </div>
    <!-- #endregion /AddNewNoteForm -->
  </body>
</html>
